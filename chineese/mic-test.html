<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка микрофона — Китайский с героем</title>
<style>
body{margin:0;background:#fff6e8;color:#2b2350;font:600 17px system-ui,-apple-system,sans-serif;padding:20px}
.card{background:#fff;border-radius:18px;padding:18px;max-width:720px;margin:0 auto 14px;box-shadow:0 6px 20px rgba(43,35,80,.08)}
h1{font-size:22px;margin:0 0 6px}
button{font:800 16px system-ui;border:0;border-radius:14px;padding:12px 16px;margin:4px 6px 4px 0;background:#ff7a45;color:#fff;cursor:pointer}
button.v{background:#7c5cff} button.g{background:#22b573}
#log{font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#2b2350;color:#e9e2ff;border-radius:12px;padding:12px;min-height:120px}
.small{font-size:14px;color:#7a7396}
</style>
</head>
<body>
<div class="card">
  <h1>🎤 Проверка микрофона и распознавания речи</h1>
  <p class="small">Нажимайте кнопки по очереди сверху вниз. После каждой кнопки с языком скажите что-нибудь на этом языке. В конце нажмите «Скопировать отчёт» и вставьте его в чат.</p>
  <button onclick="testMic()">1. Микрофон</button><br>
  <button class="v" onclick="testSR('ru-RU','скажите «привет»')">2. Русский</button>
  <button class="v" onclick="testSR('en-US','say «hello»')">3. Английский</button>
  <button class="v" onclick="testSR('zh-CN','скажите «ни хао»')">4. Китайский (zh-CN)</button>
  <button class="v" onclick="testSR('cmn-Hans-CN','скажите «ни хао»')">5. Китайский (другой код)</button><br>
  <button class="g" onclick="copyLog()">📋 Скопировать отчёт</button>
</div>
<div class="card"><div id="log"></div></div>
<script>
var L=document.getElementById('log');
function log(s){ var t=new Date().toTimeString().slice(0,8); L.textContent+=t+'  '+s+'\n'; }
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
log('Браузер: '+navigator.userAgent);
log('Адрес: '+location.href+' | защищённый: '+window.isSecureContext);
log('SpeechRecognition: '+(window.SpeechRecognition?'есть':'нет')+', webkitSpeechRecognition: '+(window.webkitSpeechRecognition?'есть':'нет'));
log('Язык системы: '+navigator.language+' / '+(navigator.languages||[]).join(','));
if(navigator.permissions&&navigator.permissions.query){
  navigator.permissions.query({name:'microphone'}).then(function(p){log('Разрешение микрофона для сайта: '+p.state);}).catch(function(e){log('permissions.query: '+e.name);});
}
function testMic(){
  if(!navigator.mediaDevices){ log('МИКРОФОН: mediaDevices нет'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var tr=st.getAudioTracks()[0]; log('МИКРОФОН: ОК — '+(tr&&tr.label||'без названия')); st.getTracks().forEach(function(t){t.stop();});
  }).catch(function(e){ log('МИКРОФОН: ОШИБКА '+e.name+' — '+e.message); });
}
function testSR(lang,hint){
  if(!SR){ log('['+lang+'] распознавания речи в этом браузере нет'); return; }
  var r; try{ r=new SR(); }catch(e){ log('['+lang+'] не создаётся: '+e.name+' '+e.message); return; }
  r.lang=lang; r.interimResults=false; r.maxAlternatives=3; r.continuous=false;
  log('['+lang+'] старт… '+hint);
  r.onstart=function(){log('['+lang+'] onstart');};
  r.onaudiostart=function(){log('['+lang+'] звук пошёл');};
  r.onspeechstart=function(){log('['+lang+'] слышу речь');};
  r.onresult=function(e){ var a=[]; for(var i=0;i<e.results[0].length;i++) a.push(e.results[0][i].transcript); log('['+lang+'] ✅ РАСПОЗНАНО: '+a.join(' | ')); };
  r.onerror=function(e){ log('['+lang+'] ❌ ОШИБКА: '+e.error+(e.message?' — '+e.message:'')); };
  r.onend=function(){ log('['+lang+'] конец'); };
  try{ r.start(); }catch(e){ log('['+lang+'] start() упал: '+e.name+' '+e.message); }
}
function copyLog(){
  var t=L.textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert('Отчёт скопирован — вставьте его в чат');})
  .catch(function(){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('Отчёт скопирован — вставьте его в чат'); });
}
</script>
</body>
</html>
