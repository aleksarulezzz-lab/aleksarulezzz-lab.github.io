<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Китайский с героем</title>
<meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff6e8;color:#2b2350;font:700 20px system-ui,-apple-system,sans-serif;text-align:center;padding:24px}</style>
</head>
<body>
<div id="msg">Загружаю тренажёр… 🐉</div>
<script>
/* Указатель для aleksarulezzz.ru/chineese/.
   Сам тренажёр лежит в репозитории aleksarulezzz-lab/chineese (файл index.html).
   Страница берёт его оттуда и хранит копию в браузере на случай плохого интернета. */
(function(){
  var SRC='https://raw.githubusercontent.com/aleksarulezzz-lab/chineese/main/index.html';
  /* временный запасной источник — пока index.html не загружен в репозиторий chineese */
  var TMP='https://storage.googleapis.com/runable-templates/cli-uploads%2Fx8wZn6Nw4RyWsdkYGTh5IQjVi293hd26%2FDEg2J78cxHFuJ6rbv75Vk%2Ftrainer-app.js';
  var CACHE='hanzi-hero-app-html', done=false;
  function ok(h){ return typeof h==='string' && h.indexOf('hanzi-hero-v1')>0; }
  function show(html){ if(done) return; done=true; try{ localStorage.setItem(CACHE,html); }catch(e){} document.open(); document.write(html); document.close(); }
  function fromCache(){
    var c=null; try{ c=localStorage.getItem(CACHE); }catch(e){}
    if(ok(c)) show(c);
    else document.getElementById('msg').innerHTML='Не получилось загрузить тренажёр 😕<br>Проверьте интернет и обновите страницу.';
  }
  function fromTmp(){
    var s=document.createElement('script'); s.src=TMP;
    s.onload=function(){ ok(window.__HANZI_APP_HTML)?show(window.__HANZI_APP_HTML):fromCache(); };
    s.onerror=fromCache; document.head.appendChild(s);
  }
  fetch(SRC+'?v='+Math.floor(Date.now()/6e5),{cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(html){ if(!ok(html)) throw 0; show(html); })
    .catch(fromTmp);
})();
</script>
</body>
</html>
